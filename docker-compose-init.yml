services:
  geojson-filter:
    image: alpine:latest
    volumes:
      - ./packages/app/src/assets/geodata:/data
    # Installs curl & jq, fetches the file, filters for kanton == "AG", and saves it
    command: >
      sh -c "
        apk add --no-cache curl jq &&
        echo 'Fetching GeoJSON data...' &&
        curl -s https://data.geo.admin.ch/ch.babs.notfalltreffpunkte/notfalltreffpunkte/notfalltreffpunkte.geojson | 
        jq '.features |= map(select(.properties.kanton == \"AG\"))' > /data/ntp/notfalltreffpunkte_ag.geojson &&
        echo 'Success! Filtered file saved as notfalltreffpunkte_ag.geojson'
        echo 'Fetching AGIS Shapefile...' &&
        curl -sL https://api.geo.ag.ch/v1/data/downloads/AGIS.amb_bsr/download/Shapefile/kanton_aargau -o /data/zso_orgs/AGIS.amb_bsr__kanton_aargau__Shapefile.zip &&
        echo 'Success! Shapefile downloaded and saved as AGIS.amb_bsr__kanton_aargau__Shapefile.zip.'
      "